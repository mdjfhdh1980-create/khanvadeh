<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الو 💙</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #edf7ff 0%, #dfeeff 100%);
      color: #15324a;
    }
    .hidden { display: none !important; }

    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #f6fbff 0%, #dfeeff 55%, #d8ebff 100%);
    }

    .card {
      width: min(420px, 100%);
      background: rgba(255,255,255,0.9);
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(8, 124, 245, 0.18);
      border: 1px solid rgba(135, 179, 245, 0.25);
      backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #087cf5;
      margin-bottom: 8px;
    }

    .sub {
      color: #718096;
      margin-bottom: 22px;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6e7f5;
      border-radius: 13px;
      margin: 7px 0;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #087cf5;
      box-shadow: 0 0 0 4px rgba(8, 124, 245, 0.08);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #087cf5, #32a7ff);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 26px rgba(8, 124, 245, 0.22);
    }

    .btn:hover { transform: translateY(-1px); }
    .switch {
      text-align: center;
      color: #087cf5;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .error {
      color: #d33;
      min-height: 24px;
      margin-top: 10px;
      font-size: 14px;
    }

    .app {
      height: 100vh;
      display: flex;
      max-width: 1200px;
      margin: auto;
      background: #fff;
      border-left: 1px solid #dfeaf8;
      border-right: 1px solid #dfeaf8;
    }

    .side {
      width: 300px;
      background: #f5faff;
      border-left: 1px solid #dcebf7;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding: 24px 20px;
      color: white;
      background: linear-gradient(135deg, #087cf5, #00a9f6);
    }

    .brand h2 { margin: 0; font-size: 28px; }
    .brand small { opacity: 0.9; }

    .me {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #dfe9f5;
      background: #edf6ff;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #23b26b;
      margin-left: 8px;
      box-shadow: 0 0 0 4px rgba(35, 178, 107, 0.12);
    }

    .me b { font-size: 15px; }
    .me div { font-size: 12px; color: #5b738f; }

    .group {
      padding: 0;
      flex: 1;
      overflow: auto;
    }

    .group-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #e7f0fb;
      font-size: 14px;
      background: #fff;
    }

    .group-item b {
      font-weight: 600;
      color: #21415f;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      padding: 18px 22px;
      border-bottom: 1px solid #e1edf7;
      background: #f9fcff;
    }

    .header b { font-size: 20px; }
    .header div { color: #69839e; margin-top: 4px; font-size: 13px; }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 22px;
      background: #f2f9ff;
    }

    .msg {
      max-width: 72%;
      background: white;
      border-radius: 17px;
      padding: 11px 14px;
      margin: 10px 0;
      box-shadow: 0 2px 10px rgba(22, 75, 114, 0.08);
      word-break: break-word;
      line-height: 1.8;
    }

    .mine {
      margin-right: auto;
      background: linear-gradient(135deg, #087cf5, #4aa8ff);
      color: white;
    }

    .who {
      font-size: 11px;
      font-weight: bold;
      opacity: 0.72;
      margin-bottom: 4px;
    }

    .time {
      font-size: 9px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .compose {
      display: flex;
      gap: 8px;
      padding: 13px;
      border-top: 1px solid #e1edf7;
      background: #fff;
    }

    .compose input {
      margin: 0;
      flex: 1;
    }

    .send {
      width: auto;
      padding: 0 20px;
      min-width: 110px;
    }

    .empty {
      color: #7a8ea5;
      padding: 12px 6px;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .side { width: 85px; }
      .brand h2 { font-size: 13px; }
      .brand small, .me div, .group-item b { display: none; }
      .me, .group-item { justify-content: center; text-align: center; }
      .msg { max-width: 85%; }
      .header b { font-size: 16px; }
    }
  </style>
</head>
<body>
  <section id="auth" class="auth">
    <div class="card">
      <div class="logo">الو 💙</div>
      <div class="sub">پیام‌رسان حرفه‌ای و سریع</div>

      <div id="loginBox">
        <input id="loginUser" placeholder="نام کاربری">
        <input id="loginPass" type="password" placeholder="رمز عبور">
        <button class="btn" onclick="login()">ورود</button>
        <div class="switch" onclick="toggleAuth()">ثبت‌نام حساب جدید</div>
      </div>

      <div id="registerBox" class="hidden">
        <input id="regName" placeholder="نام شما">
        <input id="regUser" placeholder="نام کاربری">
        <input id="regPass" type="password" placeholder="رمز عبور">
        <button class="btn" onclick="register()">ثبت‌نام</button>
        <div class="switch" onclick="toggleAuth()">قبلاً حساب دارم</div>
      </div>

      <div id="error" class="error"></div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside class="side">
      <div class="brand">
        <h2>الو</h2>
        <small>گروه دوستان و خانواده</small>
      </div>

      <div class="me">
        <span class="dot"></span>
        <div style="margin-right:8px;display:flex;flex-direction:column;gap:4px;">
          <b id="myName"></b>
          <div>آنلاین</div>
        </div>
      </div>

      <div id="onlineList" class="group"></div>
    </aside>

    <main class="main">
      <header class="header">
        <b>گروه الو</b>
        <div>چت لحظه‌ای و امن</div>
      </header>

      <div id="messages" class="messages"></div>

      <form class="compose" onsubmit="send(event)">
        <input id="text" placeholder="پیام خود را بنویسید..." autocomplete="off">
        <button class="btn send">ارسال</button>
      </form>
    </main>
  </section>

  <script>
    let token = localStorage.getItem('familyToken'), me, socket;
    const $ = x => document.getElementById(x);

    function toggleAuth() {
      $('loginBox').classList.toggle('hidden');
      $('registerBox').classList.toggle('hidden');
      $('error').textContent = '';
    }

    async function post(url, data) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const d = await r.json();
      if (!r.ok) throw Error(d.error || 'درخواست ناموفق بود');
      return d;
    }

    async function register() {
      try {
        const d = await post('/api/register', {
          name: $('regName').value,
          username: $('regUser').value,
          password: $('regPass').value,
        });
        token = d.token;
        localStorage.setItem('familyToken', token);
        openApp(d.user);
      } catch (e) {
        $('error').textContent = e.message;
      }
    }

    async function login() {
      try {
        const d = await post('/api/login', {
          username: $('loginUser').value,
          password: $('loginPass').value,
        });
        token = d.token;
        localStorage.setItem('familyToken', token);
        openApp(d.user);
      } catch (e) {
        $('error').textContent = e.message;
      }
    }

    function renderPresence(users) {
      const list = $('onlineList');
      if (!list) return;

      list.innerHTML = '';
      const arr = (users || []).filter(u => u && u.id);

      if (!arr.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'هیچ کس آنلاین نیست';
        list.appendChild(empty);
        return;
      }

      arr.forEach(u => {
        const row = document.createElement('div');
        row.className = 'group-item';
        row.innerHTML = '<span class="dot"></span><b>' + esc(u.name || u.username || 'کاربر') + '</b>';
        list.appendChild(row);
      });
    }

    async function openApp(user) {
      me = user;
      $('myName').textContent = user.name;
      $('auth').classList.add('hidden');
      $('app').classList.remove('hidden');

      const r = await fetch('/api/messages', { headers: { Authorization: token } });
      if (r.ok) {
        const msgs = await r.json();
        $('messages').innerHTML = '';
        msgs.forEach(add);
      }

      socket = io({ auth: { token } });
      socket.on('newMessage', add);
      socket.on('presence', renderPresence);
    }

    function add(m) {
      const d = document.createElement('div');
      d.className = 'msg ' + (m.userId === me.id ? 'mine' : '');
      d.innerHTML = '<div class="who">' + esc(m.name) + '</div>' + esc(m.text) + '<div class="time">' + new Date(m.createdAt).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }) + '</div>';
      $('messages').appendChild(d);
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    function send(e) {
      e.preventDefault();
      const text = $('text').value.trim();
      if (text && socket) {
        socket.emit('sendMessage', text);
        $('text').value = '';
      }
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    }

    if (token) {
      fetch('/api/me', { headers: { Authorization: token } })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(openApp)
        .catch(() => localStorage.removeItem('familyToken'));
    }
  </script>
</body>
</html>
