<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خانواده 💙</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eaf4ff;color:#15324a}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:white;padding:28px;border-radius:24px;box-shadow:0 15px 50px #087cf533}.logo{font-size:32px;font-weight:bold;color:#087cf5;margin-bottom:5px}.sub{color:#718096;margin-bottom:20px}input{width:100%;padding:13px;border:1px solid #d6e7f5;border-radius:13px;margin:7px 0;outline:none}.btn{width:100%;padding:13px;border:0;border-radius:13px;background:#087cf5;color:#fff;font-weight:bold;cursor:pointer}.switch{text-align:center;color:#087cf5;margin-top:15px;cursor:pointer}.error{color:#d33;min-height:20px}.app{height:100vh;display:flex;max-width:1100px;margin:auto;background:#fff}.side{width:300px;background:#f5faff;border-left:1px solid #dcebf7}.brand{padding:24px;color:white;background:linear-gradient(135deg,#087cf5,#00a9f6)}.brand h2{margin:0}.me,.group-item{padding:18px 20px;border-bottom:1px solid #dfe9f5;display:flex;align-items:center}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#23b26b;margin-left:6px}.me b,.group-item b{font-size:15px}.group{padding:0}.group-item .dot{margin-left:10px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.header{padding:18px 22px;border-bottom:1px solid #e1edf7}.messages{flex:1;overflow:auto;padding:22px;background:#f2f9ff}.msg{max-width:72%;background:white;border-radius:17px;padding:11px 14px;margin:10px 0;box-shadow:0 2px 8px #164b7212}.mine{margin-right:auto;background:#087cf5;color:white}.who{font-size:11px;font-weight:bold;opacity:.7;margin-bottom:4px}.time{font-size:9px;opacity:.65;margin-top:5px}.compose{display:flex;gap:8px;padding:13px;border-top:1px solid #e1edf7}.compose input{margin:0;flex:1}.send{width:auto;padding:0 20px}.empty{color:#7a8ea5;padding:12px}.@media(max-width:650px){.side{width:85px}.brand h2{font-size:13px}.brand small,.me div,.group div,.me b,.group-item b{display:none}.me,.group-item{text-align:center;justify-content:center}.msg{max-width:85%}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="card">
<div class="logo">خانواده 💙</div><div class="sub">پیام‌رسان خانوادگی</div>
<div id="loginBox">
<input id="loginUser" placeholder="نام کاربری"><input id="loginPass" type="password" placeholder="رمز عبور">
<button class="btn" onclick="login()">ورود</button><div class="switch" onclick="toggleAuth()">ثبت‌نام حساب جدید</div>
</div>
<div id="registerBox" class="hidden">
<input id="regName" placeholder="نام شما"><input id="regUser" placeholder="نام کاربری"><input id="regPass" type="password" placeholder="رمز عبور">
<button class="btn" onclick="register()">ثبت‌نام</button><div class="switch" onclick="toggleAuth()">قبلاً حساب دارم</div>
</div>
<div id="error" class="error"></div>
</div></section>

<section id="app" class="app hidden">
<aside class="side"><div class="brand"><h2>خانواده</h2><small>گروه خانوادگی</small></div><div class="me"><span class="dot"></span><b id="myName"></b><div>آنلاین</div></div><div id="onlineList" class="group"></div></aside>
<main class="main"><header class="header"><b>گروه خانواده</b><div>چت لحظه‌ای اعضای خانواده</div></header><div id="messages" class="messages"></div>
<form class="compose" onsubmit="send(event)"><input id="text" placeholder="پیام خود را بنویسید..." autocomplete="off"><button class="btn send">ارسال</button></form></main>
</section>
<script>
let token=localStorage.getItem('familyToken'),me,socket;
const $=x=>document.getElementById(x);
function toggleAuth(){$('loginBox').classList.toggle('hidden');$('registerBox').classList.toggle('hidden');$('error').textContent=''}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'درخواست ناموفق بود');return d}
async function register(){try{const d=await post('/api/register',{name:$('regName').value,username:$('regUser').value,password:$('regPass').value});token=d.token;localStorage.setItem('familyToken',token);openApp(d.user)}catch(e){$('error').textContent=e.message}}
async function login(){try{const d=await post('/api/login',{username:$('loginUser').value,password:$('loginPass').value});token=d.token;localStorage.setItem('familyToken',token);openApp(d.user)}catch(e){$('error').textContent=e.message}}
function renderPresence(users){
  const list=$('onlineList');
  if(!list)return;
  list.innerHTML='';
  const arr=(users||[]).filter(u=>u&&u.id);
  if(!arr.length){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent='هیچ کس آنلاین نیست';
    list.appendChild(empty);
    return;
  }
  arr.forEach(u=>{
    const row=document.createElement('div');
    row.className='group-item';
    row.innerHTML='<span class="dot"></span><b>'+esc(u.name||u.username||'کاربر')+'</b>';
    list.appendChild(row);
  });
}
async function openApp(user){
  me=user;
  $('myName').textContent=user.name;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  const r=await fetch('/api/messages',{headers:{Authorization:token}});
  if(r.ok){
    const msgs=await r.json();
    $('messages').innerHTML='';
    msgs.forEach(add);
  }
  socket=io({auth:{token}});
  socket.on('newMessage',add);
  socket.on('presence',renderPresence);
}
function add(m){const d=document.createElement('div');d.className='msg '+(m.userId===me.id?'mine':'');d.innerHTML='<div class="who">'+esc(m.name)+'</div>'+esc(m.text)+'<div class="time">'+new Date(m.createdAt).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'</div>'; $('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function send(e){e.preventDefault();const t=$('text').value.trim();if(t&&socket){socket.emit('sendMessage',t);$('text').value=''}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
if(token){fetch('/api/me',{headers:{Authorization:token}}).then(r=>r.ok?r.json():Promise.reject()).then(openApp).catch(()=>localStorage.removeItem('familyToken'))}
</script>
</body>
</html>
